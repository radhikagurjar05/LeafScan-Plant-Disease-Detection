services:
  - type: web
    name: leafscan-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    rootDir: backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        fromEnvVar: OPENAI_API_KEY

  - type: web
    name: leafscan-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://leafscan-backend.onrender.com
